<script>

function togglePassword(inputId) {

    const input = document.getElementById(inputId);

    if (!input) return;

    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}


/* =====================================================
   PAPER DATE
===================================================== */

function generatePaperDates() {

    const dateInput = document.getElementById('paperDate');
    const dateMr = document.getElementById('date_mr');
    const dateEn = document.getElementById('date_en');

    if (!dateInput || !dateMr || !dateEn || !dateInput.value) {
        return;
    }

    const date = new Date(dateInput.value + 'T00:00:00');

    const marathiDays = [
        'रविवार',
        'सोमवार',
        'मंगळवार',
        'बुधवार',
        'गुरुवार',
        'शुक्रवार',
        'शनिवार'
    ];

    const englishDays = [
        'Sunday',
        'Monday',
        'Tuesday',
        'Wednesday',
        'Thursday',
        'Friday',
        'Saturday'
    ];

    const marathiMonths = [
        'जानेवारी',
        'फेब्रुवारी',
        'मार्च',
        'एप्रिल',
        'मे',
        'जून',
        'जुलै',
        'ऑगस्ट',
        'सप्टेंबर',
        'ऑक्टोबर',
        'नोव्हेंबर',
        'डिसेंबर'
    ];

    const englishMonths = [
        'January',
        'February',
        'March',
        'April',
        'May',
        'June',
        'July',
        'August',
        'September',
        'October',
        'November',
        'December'
    ];

    const marathiNumbers = [
        '०','१','२','३','४',
        '५','६','७','८','९'
    ];

    function toMarathiNumber(number) {

        return String(number)
            .split('')
            .map(char => marathiNumbers[Number(char)])
            .join('');

    }

    const day = date.getDate();
    const month = date.getMonth();
    const year = date.getFullYear();
    const dayIndex = date.getDay();

    dateMr.value =
        marathiDays[dayIndex] +
        ', दि. ' +
        toMarathiNumber(day) +
        ' ' +
        marathiMonths[month] +
        ' ' +
        toMarathiNumber(year);

    dateEn.value =
        englishDays[dayIndex] +
        ', ' +
        day +
        ' ' +
        englishMonths[month] +
        ' ' +
        year;
}


const paperDate = document.getElementById('paperDate');

if (paperDate) {

    paperDate.addEventListener(
        'change',
        generatePaperDates
    );

}


/* =====================================================
   RNI / PRGI
===================================================== */

const uploadCategory =
    document.querySelector(
        'form[action="/upload-paper"] select[name="category"]'
    );

const rniInput =
    document.getElementById('rniNumber');

const rniNumbers = {

    daily: 'PRGI/MHMAR/26/A1903',

    weekly: 'PRGI/MHMAR/26/WEEKLY_NUMBER',

    monthly: ''

};


function updateRniNumber() {

    if (!uploadCategory || !rniInput) {
        return;
    }

    rniInput.value =
        rniNumbers[uploadCategory.value] || '';

}


if (uploadCategory) {

    uploadCategory.addEventListener(
        'change',
        updateRniNumber
    );

    updateRniNumber();

}



/* =====================================================
   DELETE PAPER
===================================================== */

const deleteCategory =
    document.getElementById('deleteCategory');

const deletePaperSelect =
    document.getElementById('deletePaperSelect');

const deleteCategoryHidden =
    document.getElementById('deleteCategoryHidden');

const deleteIndexHidden =
    document.getElementById('deleteIndexHidden');


/* =====================================================
   LOAD DELETE PAPERS
===================================================== */

async function loadDeletePapers() {

    if (
        !deleteCategory ||
        !deletePaperSelect
    ) {

        console.error(
            'Delete section सापडला नाही.'
        );

        return;

    }


    const category =
        deleteCategory.value;


    /* Hidden category set करा */

    if (deleteCategoryHidden) {

        deleteCategoryHidden.value =
            category;

    }


    /* Loading */

    deletePaperSelect.innerHTML =
        '<option value="">अंक शोधत आहे...</option>';


    if (deleteIndexHidden) {

        deleteIndexHidden.value = '';

    }


    try {

        const response =
            await fetch(
                '/get-paper-info?time=' +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                'get-paper-info failed'
            );

        }


        const data =
            await response.json();


        console.log(
            'Delete data:',
            data
        );


        const papers =
            Array.isArray(
                data[category]
            )
                ? data[category]
                : [];


        /* आधीचे options काढा */

        deletePaperSelect.innerHTML =
            '<option value="">-- Delete करायचा अंक निवडा --</option>';


        if (papers.length === 0) {

            deletePaperSelect.innerHTML =
                '<option value="">या विभागात कोणताही अंक नाही</option>';

            return;

        }


        /* सर्व papers dropdown मध्ये दाखवा */

        papers.forEach(
            (paper, index) => {

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    index;


                option.textContent =
                    (
                        paper.date_mr ||
                        paper.date_en ||
                        'तारीख नाही'
                    ) +
                    ' | अंक क्र. ' +
                    (
                        paper.issue ||
                        '-'
                    );


                deletePaperSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            'DELETE LIST ERROR:',
            error
        );


        deletePaperSelect.innerHTML =
            '<option value="">अंकांची यादी मिळाली नाही</option>';

    }

}


/* =====================================================
   CATEGORY CHANGE
===================================================== */

if (deleteCategory) {

    deleteCategory.addEventListener(
        'change',
        loadDeletePapers
    );

}


/* =====================================================
   PAPER SELECT CHANGE
===================================================== */

if (deletePaperSelect) {

    deletePaperSelect.addEventListener(
        'change',
        function () {

            if (deleteIndexHidden) {

                deleteIndexHidden.value =
                    this.value;

            }

        }
    );

}


/* =====================================================
   CONFIRM DELETE
===================================================== */

function confirmDeletePaper() {

    const category =
        deleteCategory.value;

    const index =
        deletePaperSelect.value;


    /* Hidden values पुन्हा set */

    if (deleteCategoryHidden) {

        deleteCategoryHidden.value =
            category;

    }


    if (deleteIndexHidden) {

        deleteIndexHidden.value =
            index;

    }


    if (!category) {

        alert(
            'कृपया विभाग निवडा.'
        );

        return false;

    }


    if (
        index === '' ||
        index === null ||
        index === undefined
    ) {

        alert(
            'कृपया Delete करायचा अंक निवडा.'
        );

        return false;

    }


    const selectedText =
        deletePaperSelect
            .options[
                deletePaperSelect.selectedIndex
            ]
            .text;


    return confirm(

        '⚠️ हा अंक कायमचा Delete करायचा आहे का?\n\n' +

        selectedText +

        '\n\nPDF फाईल आणि त्याची माहिती दोन्ही Delete होतील.' +

        '\n\nही कृती परत करता येणार नाही.'

    );

}

            '<option value="">अंकांची यादी मिळाली नाही</option>';

    }

}


/* =====================================================
   LOAD SELECTED PAPER DATA
===================================================== */

async function loadSelectedEditPaper() {

    const category =
        editCategory.value;

    const index =
        editPaperSelect.value;


    if (
        index === '' ||
        index === null ||
        index === undefined
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                '/get-paper-info?time=' +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                'Paper information मिळाली नाही.'
            );

        }


        const data =
            await response.json();


        const papers =
            Array.isArray(
                data[category]
            )
                ? data[category]
                : [];


        const paper =
            papers[index];


        if (!paper) {

            alert(
                'निवडलेला अंक सापडला नाही.'
            );

            return;

        }


        /* Hidden values */

        editCategoryHidden.value =
            category;

        editIndexHidden.value =
            index;


        /* Existing information */

        editEditor.value =
            paper.editor || '';

        editMobile.value =
            paper.mobile || '';

        editYear.value =
            paper.year || '';

        editIssue.value =
            paper.issue || '';

        editRni.value =
            paper.rni || '';

        editPrice.value =
            paper.price || '';

        editPages.value =
            paper.pages || '';


        /* Date */

        if (paper.date_en) {

            const match =
                paper.date_en.match(
                    /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/
                );


            if (match) {

                const day =
                    match[1].padStart(
                        2,
                        '0'
                    );

                const monthName =
                    match[2];

                const year =
                    match[3];


                const monthMap = {

                    January: '01',
                    February: '02',
                    March: '03',
                    April: '04',
                    May: '05',
                    June: '06',
                    July: '07',
                    August: '08',
                    September: '09',
                    October: '10',
                    November: '11',
                    December: '12'

                };


                if (
                    monthMap[monthName]
                ) {

                    editDate.value =
                        year +
                        '-' +
                        monthMap[monthName] +
                        '-' +
                        day;

                }

            }

        }


        editDateMr.value =
            paper.date_mr || '';

        editDateEn.value =
            paper.date_en || '';


        console.log(
            'Edit paper loaded:',
            paper
        );


    } catch (error) {

        console.error(
            'EDIT PAPER LOAD ERROR:',
            error
        );


        alert(
            'अंकाची माहिती load करता आली नाही.'
        );

    }

}


/* =====================================================
   EDIT CATEGORY CHANGE
===================================================== */

if (editCategory) {

    editCategory.addEventListener(
        'change',
        loadEditPapers
    );

}


/* =====================================================
   EDIT PAPER SELECT
===================================================== */

if (editPaperSelect) {

    editPaperSelect.addEventListener(
        'change',
        loadSelectedEditPaper
    );

}


/* =====================================================
   EDIT DATE
===================================================== */

if (editDate) {

    editDate.addEventListener(
        'change',
        function () {

            const value =
                this.value;


            if (!value) {

                return;

            }


            const date =
                new Date(
                    value +
                    'T00:00:00'
                );


            const marathiDays = [

                'रविवार',
                'सोमवार',
                'मंगळवार',
                'बुधवार',
                'गुरुवार',
                'शुक्रवार',
                'शनिवार'

            ];


            const englishDays = [

                'Sunday',
                'Monday',
                'Tuesday',
                'Wednesday',
                'Thursday',
                'Friday',
                'Saturday'

            ];


            const marathiMonths = [

                'जानेवारी',
                'फेब्रुवारी',
                'मार्च',
                'एप्रिल',
                'मे',
                'जून',
                'जुलै',
                'ऑगस्ट',
                'सप्टेंबर',
                'ऑक्टोबर',
                'नोव्हेंबर',
                'डिसेंबर'

            ];


            const englishMonths = [

                'January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'July',
                'August',
                'September',
                'October',
                'November',
                'December'

            ];


            const marathiNumbers = [

                '०','१','२','३','४',
                '५','६','७','८','९'

            ];


            function toMarathiNumber(number) {

                return String(number)
                    .split('')
                    .map(
                        char =>
                            marathiNumbers[
                                Number(char)
                            ]
                    )
                    .join('');

            }


            const day =
                date.getDate();

            const month =
                date.getMonth();

            const year =
                date.getFullYear();

            const dayIndex =
                date.getDay();


            editDateMr.value =
                marathiDays[dayIndex] +
                ', दि. ' +
                toMarathiNumber(day) +
                ' ' +
                marathiMonths[month] +
                ' ' +
                toMarathiNumber(year);


            editDateEn.value =
                englishDays[dayIndex] +
                ', ' +
                day +
                ' ' +
                englishMonths[month] +
                ' ' +
                year;

        }

    );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadEditPapers();



</script>
