<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - दैनिक लोकभारती</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #111111,
                #292929
            );
        }

        .login-box {

            width: 380px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.5);
        }

        .logo {

            color: #e61a22;

            font-size: 45px;

            font-weight: bold;

            margin-bottom: 5px;

            font-family: Georgia, serif;
        }

        .subtitle {

            color: #333;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #e61a22;

        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #e61a22;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #b90000;

        }

        .error {

            color: #dc3545;

            font-weight: bold;

            margin-top: 15px;

            min-height: 20px;
        }

        .back {

            display: inline-block;

            margin-top: 20px;

            color: #555;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {

            color: #e61a22;

        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        लोकभारती
    </div>

    <div class="subtitle">
        🔐 Admin Login
    </div>


    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div
        id="error"
        class="error">
    </div>


    <a
        href="/"
        class="back">
        ← E-Paper वर परत जा
    </a>

</div>


<script>

document
    .getElementById('loginForm')
    .addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            const username =
                document
                .getElementById('username')
                .value
                .trim();


            const password =
                document
                .getElementById('password')
                .value;


            const error =
                document
                .getElementById('error');


            error.innerText = '';


            try {

                const response =
                    await fetch(
                        '/admin-login',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    window.location.href =
                        '/admin-panel';

                } else {

                    error.innerText =
                        result.message;

                }

            }

            catch (error) {

                error.innerText =
                    'Server शी connection होत नाही.';

            }

        }
    );

</script>


</body>

</html>
